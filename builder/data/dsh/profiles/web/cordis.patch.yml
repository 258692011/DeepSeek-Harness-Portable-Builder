# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Deployment persona: order-0 system-prompt section read by every mode
# (standard / code / PTC). Overrides the persona from dsh-web-app's bundle
# patch (last write wins per row id). Ships with the portable so the model
# always replies in Simplified Chinese.
- id: system-prompt
  config:
    persona: |
      始终使用简体中文思考和回复用户。你输出的所有文字——包括思考、推理、分析、
      解释、建议、记录——都用简体中文表达；代码、命令、文件路径、专有名词、包名
      等除外。除非用户明确要求其他语言。
